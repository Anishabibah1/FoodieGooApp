basePath: /
definitions:
  models.MenuItem:
    properties:
      category:
        type: string
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      price:
        type: integer
      restaurant_id:
        type: string
    type: object
  models.MenuResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.MenuItem'
        type: array
      message:
        type: string
      success:
        type: boolean
    type: object
  models.Order:
    properties:
      date:
        type: string
      id:
        type: string
      items:
        items:
          type: string
        type: array
      restaurant_id:
        type: string
      resto_image:
        type: string
      resto_name:
        type: string
      status:
        type: string
      total:
        type: integer
    type: object
  models.OrderResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Order'
        type: array
      message:
        type: string
      success:
        type: boolean
    type: object
  models.Restaurant:
    properties:
      area:
        type: string
      category:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      rating:
        type: number
      time:
        type: string
    type: object
  models.RestaurantResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Restaurant'
        type: array
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API untuk aplikasi FoodieGoo food delivery
  title: FoodieGoo API
  version: "1.0"
paths:
  /api/menu/{id}:
    get:
      consumes:
      - application/json
      description: Get menu item detail by ID
      parameters:
      - description: Menu ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MenuItem'
      summary: Get menu by ID
      tags:
      - menu
  /api/orders:
    get:
      consumes:
      - application/json
      description: Get list of all orders
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OrderResponse'
      summary: Get all orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Create a new order
      parameters:
      - description: Order data
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/models.Order'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Order'
      summary: Create new order
      tags:
      - orders
  /api/orders/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an order by ID
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete order
      tags:
      - orders
    get:
      consumes:
      - application/json
      description: Get order detail by ID
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Order'
      summary: Get order by ID
      tags:
      - orders
  /api/orders/{id}/status:
    put:
      consumes:
      - application/json
      description: Update status of an order
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Status
        in: body
        name: status
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Order'
      summary: Update order status
      tags:
      - orders
  /api/restaurants:
    get:
      consumes:
      - application/json
      description: Get list of all restaurants
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RestaurantResponse'
      summary: Get all restaurants
      tags:
      - restaurants
  /api/restaurants/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a restaurant by ID
      parameters:
      - description: Restaurant ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete restaurant
      tags:
      - restaurants
    get:
      consumes:
      - application/json
      description: Get restaurant detail by ID
      parameters:
      - description: Restaurant ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Restaurant'
      summary: Get restaurant by ID
      tags:
      - restaurants
  /api/restaurants/{id}/menu:
    get:
      consumes:
      - application/json
      description: Get list of menu items by restaurant ID
      parameters:
      - description: Restaurant ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MenuResponse'
      summary: Get menu by restaurant
      tags:
      - menu
  /api/restaurants/search:
    get:
      consumes:
      - application/json
      description: Search restaurants by name or category
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RestaurantResponse'
      summary: Search restaurants
      tags:
      - restaurants
swagger: "2.0"
